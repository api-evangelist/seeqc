name: Seeqc
description: 'Seeqc is developing the first digital quantum computing platform for
  businesses, integrating all core functions of a quantum computer - qubits together
  with classical control logic - onto a single superconducting chip operating at
  millikelvin temperatures. Founded in 2019 and holding over 115 patents, the company
  combines classical and quantum technologies to address the efficiency, stability,
  and cost challenges endemic to scalable quantum computing, and also offers
  superconducting chip foundry services. As a quantum-hardware and foundry company,
  Seeqc currently publishes no public developer API, SDK, or documentation surface.'
